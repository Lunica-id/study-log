<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Interest Record</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://kit.fontawesome.com/20b7c06391.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <section id="folder-list-section">
            <h1>Interest Record</h1>
            <button id="home-ellipsis"><i class="fa-solid fa-ellipsis-vertical"></i></button>
            <div class="wrapper">
                <div id="add-root-folder" class="folder-grid sweep-hover">
                    <i class="fa-solid fa-plus"></i>
                </div>
            </div>
        </section>

        <section id="folder-content-section" class="hidden">
            <header class="folder-header">
                <button id="back-button"><i class="fa-solid fa-arrow-left"></i></button>
                <h1 class="folder-title">Sample</h1>
                <button id="folder-menu-button"><i class="fa-solid fa-ellipsis-vertical"></i></button>
            </header>
            <main class="none-scrollbar">
                <div class="wrapper none-scrollbar">
                    <div id="add-child-folder" class="folder-grid sweep-hover">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                </div>
                <ul class="item-list none-scrollbar">
                    <li id="add-item" class="item-card sweep-hover">
                        <i class="fa-solid fa-plus"></i>
                    </li>
                </ul>   
            </main>
            
            <footer class="folder-footer">
                <textarea placeholder="Overall Memo" class="overall-memo"></textarea>
            </footer>
        </section>

        <div id="control-home-modal" class="hidden">
            <p id="import-button" class="control-modal">Import file</p>
            <p id="export-button" class="control-modal">Export file</p>
        </div>
        <div id="import-file-modal" class="overlay hidden">
            <div id="import-file-wrapper">
                <h2>Import File</h2>
                <form id="import-form">
                    <input type="file" id="import-file" accept=".json">
                </form>
                <div id="import-button-wrapper">
                    <button id="import-cancel-button">Cancel</button>
                    <button id="import-submit-button">Import</button>
                </div>
            </div>
        </div>
        <div id="edit-folder-modal" class="overlay hidden">
            <div id="edit-folder-container">
                <h2 id="edit-folder-heading">Create New Folder</h2>
                <form id="folder-form">
                    <label for="folder-name">Folder Name</label>
                    <input type="text" id="folder-name" name="folder-name" required>
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </form>
                <div id="folder-form-button">
                    <button id="folder-cancel-button">Cancel</button>
                    <button id="folder-submit-button">Create</button>
                </div>
            </div>
        </div>
        <div id="edit-item-modal" class="overlay hidden">
            <div id="edit-item-container">
                <h2 id="edit-item-heading">Create New Item</h2>
                <form id="item-form">
                    <label for="item-type">Type</label>
                    <select id="item-type">
                        <option value="link">Website / Link</option>
                        <option value="youtube">YouTube</option>
                        <option value="book">Book</option>
                        <!--  <option value="document">Document</option>   -->
                    </select>
                    <div data-type="link youtube document">
                        <label for="item-source">URL</label>
                        <input type="url" id="item-source" name="item-source">
                    </div>
                    <div data-type="book">
                        <label for="item-isbn">ISBN</label>
                        <input type="text" id="item-isbn">
                    </div>
                    <div data-type="link youtube book document">
                        <label for="item-title">Title</label>
                        <input type="text" id="item-title" name="item-title" required>
                        <label for="item-date">Date</label>
                        <input type="date" id="item-date" name="item-date">
                        <label for="item-memo">Memo</label>
                        <textarea id="item-memo" name="item-memo"></textarea>
                    </div>
                </form>
                <div id="item-form-button">
                    <button id="item-cancel-button">Cancel</button>
                    <button id="item-submit-button">Create</button>
                </div>
            </div>
        </div>
        <div id="folder-menu" class="hidden">
            <p id="edit-folder-button" class="control-modal">Edit</p>
            <p id="delete-folder-button" class="control-modal">Delete</p>
        </div>
        <div id="item-menu" class="hidden">
            <p id="edit-item-button" class="control-modal">Edit</p>
            <p id="delete-item-button" class="control-modal">Delete</p>
        </div>
        <script src="script.js"></script>
    </body>
</html>
